# Not a member of the app's workspace: it builds for wasm32-wasip2, and a workspace resolves one
# set of features for one target.
[package]
name = "stonqs-concentration-tool"
version = "1.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wit-bindgen = "0.62"

[profile.release]
opt-level = "s"
strip = true
lto = true
panic = "abort"
