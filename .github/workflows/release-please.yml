name: Release please

# Keeps one open pull request that carries the next version and its changelog, written from the
# Conventional Commit subjects the commit-msg hook enforces. Merging it tags the release and calls
# `release.yml` to build it. Nothing is released by pushing to main.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.release.outputs.pr }}
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The bump touches Cargo.toml but not Cargo.lock, which records the workspace crates' own
  # versions — and every job builds with `--locked`. Left alone, the release pull request fails
  # its own CI. `--workspace` rewrites those three entries and nothing else.
  lockfile:
    needs: release-please
    if: needs.release-please.outputs.pr != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
      - name: Install the pinned toolchain
        run: rustup show
      - run: cargo update --workspace
      - name: Commit the refreshed lock
        run: |
          git diff --quiet -- Cargo.lock && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore: refresh Cargo.lock for the release"
          git push

  # The release release-please writes is a draft, and a draft carries no git tag: GitHub materialises
  # one only when somebody publishes it. Without the tag release-please cannot find its own last
  # release and bumps the version again on every push (release-please#1650), so the tag is pushed
  # here instead. `release.yml` is then *called*, not triggered by that push — a ref pushed with
  # GITHUB_TOKEN raises no workflow event.
  tag:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag the release commit
        env:
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          git tag "$TAG"
          git push origin "$TAG"

  build:
    needs: [release-please, tag]
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
    secrets: inherit
