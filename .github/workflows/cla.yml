name: CLA

# Every external pull request must be covered by .github/CLA.md before it can be merged.
# Signatures are stored as a JSON file on the `cla-signatures` branch of this repository, so the
# record lives with the code and survives a move of the CI provider.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    # A run triggered by a bot gets a read-only token and no secrets, so the action cannot write
    # the signature file even to say the author is allowlisted — and a bot has nothing to agree
    # to: its pull requests are this repository's own dependency bumps.
    if: github.actor != 'dependabot[bot]' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Check or record the contributor's signature
        if: (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A token with `repo` scope, needed to write the signature file to the storage branch.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/vvvlladimir/stonqs/blob/main/.github/CLA.md
          branch: cla-signatures
          allowlist: vvvlladimir,dependabot[bot]
