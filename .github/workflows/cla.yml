name: CLA

# Every external pull request must be covered by .github/CLA.md before it can be merged.
# Signatures are stored as a JSON file on the `cla-signatures` branch of this repository, so the
# record lives with the code and survives a move of the CI provider.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      github.event.pull_request.head.repo.full_name != github.repository
      && github.actor != 'dependabot[bot]'
      && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - name: Check or record the contributor's signature
        if: (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/vvvlladimir/stonqs/blob/main/.github/CLA.md
          branch: cla-signatures
          allowlist: vvvlladimir,dependabot[bot]
