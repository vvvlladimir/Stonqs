name: CI

# Everything that must hold before a change reaches main. The release workflow trusts this one and
# does not repeat it: a tag is only ever put on a commit that already passed here.

on:
  push:
    branches: [main]
  # `ready_for_review` is on top of the default three: a draft runs nothing, so the run happens
  # when the pull request is declared finished rather than on every commit leading up to it.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

# A second push to the same branch makes the first run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # A change to site/ alone touches nothing below. The jobs still run and pass rather than being
  # skipped: `rust (ubuntu-latest)` and `frontend` are required checks, and a skipped matrix job
  # never reports under its expanded name, which would leave such a pull request unmergeable.
  scope:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    # paths-filter lists a pull request's files through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - "!site/**"

  rust:
    name: rust (${{ matrix.os }})
    needs: scope
    # A draft is work in progress and answers no question worth three runners. `draft` is absent
    # on a push to main, and absent is not `true`, so that half of the trigger is unaffected.
    if: github.event.pull_request.draft != true
    runs-on: ${{ matrix.os }}
    env:
      RUN: ${{ needs.scope.outputs.code }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        if: env.RUN == 'true'

      # Tauri's build script refuses to run when `frontendDist` does not exist, and the Rust job
      # deliberately does not build the frontend — an empty directory is enough for `cargo test`.
      - name: Placeholder frontend output
        if: env.RUN == 'true'
        shell: bash
        run: mkdir -p app/dist

      - name: Linux system libraries
        if: env.RUN == 'true' && matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libdbus-1-dev \
            libssl-dev \
            patchelf

      # rustup reads rust-toolchain.toml and installs that version with its components; no action
      # is needed, and none may override it, or CI would test a compiler nobody develops against.
      - name: Install the pinned toolchain
        if: env.RUN == 'true'
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        if: env.RUN == 'true'
        with:
          # SQLCipher vendors OpenSSL, so a cold build is minutes on every runner.
          shared-key: ci

      - name: Format
        if: env.RUN == 'true' && matrix.os == 'ubuntu-latest'
        run: cargo fmt --all --check

      - name: Clippy
        if: env.RUN == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # No `--ignored`: those tests reach the network, and a CI run must not depend on a data
      # provider being up.
      - name: Test
        if: env.RUN == 'true'
        run: cargo test --workspace --locked

  frontend:
    name: frontend
    needs: scope
    # Not a matrix, so a skip reports success under the required name.
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      # The action runs from the repository root, where there is no package.json: the pin it
      # reads has to be pointed at.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm lint:css
      - run: pnpm format:check

      # tsc --noEmit then vite build.
      - run: pnpm build

      # The catalogs are generated from the source, so a message added without extracting them
      # ships untranslatable. Line numbers are off in lingui.config.ts, so an unrelated edit does
      # not move anything here.
      - name: Catalogs are up to date
        run: |
          pnpm i18n:extract
          git diff --exit-code -- src/locales
