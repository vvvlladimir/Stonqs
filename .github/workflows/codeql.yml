name: CodeQL
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - local-docs/**
      - LICENSE
      - .github/ISSUE_TEMPLATE/**
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      # Needed to read the workflow files themselves for the `actions` analysis.
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Rust accepts no other build mode: the extractor reads the sources, so SQLCipher and its
          # vendored OpenSSL are never built here.
          - language: rust
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          # The workflows in this directory, including the one that runs on `pull_request_target`.
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: .github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
