name: Release

# Builds the installers for a tag and leaves them in a draft release. Nothing reaches a user until
# that draft is published by hand: publishing is also what makes `latest.json` visible, so the
# updater offers a version only after somebody has looked at it.

# Called by `release-please.yml` once it has tagged the release, never by the tag itself: a tag
# pushed with GITHUB_TOKEN raises no event, so `on: push: tags` would simply never fire. The
# manual trigger is for rebuilding a tag whose run failed.
on:
  workflow_call:
    inputs:
      tag:
        description: The tag to build, for example v0.2.0.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build, for example v0.2.0.
        required: true
        type: string

permissions:
  contents: write

jobs:
  # A tag naming a version the binaries do not carry would be offered forever: the updater compares
  # the running version with the one in the feed, and installing it would not change the answer.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Tag matches the workspace version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          test "$crate" = "${TAG#v}" || {
            echo "tag $TAG does not match Cargo.toml version $crate" >&2
            exit 1
          }

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          # The oldest supported runner, because a Linux binary cannot run against a glibc older
          # than the one it was built on. Deprecated by GitHub on 2026-09-17 and unsupported from
          # 2027-04-17, with brownouts failing the job at random in between; it is kept anyway,
          # because moving to ubuntu-24.04 raises the floor from glibc 2.35 to 2.39 and drops
          # Ubuntu 22.04 and Debian 12 users. Move before the April date, not after a red release.
          - os: ubuntu-22.04
            target: ""
          - os: windows-latest
            target: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Linux system libraries
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libdbus-1-dev \
            libssl-dev \
            patchelf

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      # rust-toolchain.toml decides the version; the target is what this matrix entry adds.
      - name: Install the pinned toolchain
        shell: bash
        run: |
          rustup show
          if [ -n "${{ matrix.target }}" ]; then rustup target add ${{ matrix.target }}; fi
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update artifacts with the project's key; the public half is in
          # tauri.conf.json, so an installed copy refuses anything signed by anybody else.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          # The draft release and its notes already exist: release-please made them when its pull
          # request was merged, and this only hangs the installers on them. Naming a body here
          # would overwrite the changelog with a commit subject.
          tagName: ${{ inputs.tag }}
          releaseDraft: true
          prerelease: false
          # `latest.json`, the feed the updater reads. One per run, merged across the matrix.
          includeUpdaterJson: true
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
