name: Release

# Builds the installers for a tag and leaves them in a draft release, with a `.msixupload` for the
# Microsoft Store. Nothing reaches a user until that draft is published by hand: publishing is also
# what makes `latest.json` visible, so the updater offers a version only after somebody has looked
# at it, and what sends the Store package to the Store (`store.yml`, ADR-0096).

# Called by `release-please.yml` once it has tagged the release, never by the tag itself: a tag
# pushed with GITHUB_TOKEN raises no event, so `on: push: tags` would simply never fire. The
# manual trigger rebuilds a tag whose run failed, or only the parts ticked.
on:
  workflow_call:
    inputs:
      tag:
        description: The tag to build, for example v0.2.0.
        required: true
        type: string
      macos: { type: boolean, default: true }
      linux: { type: boolean, default: true }
      windows: { type: boolean, default: true }
      store: { type: boolean, default: true }
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to build, for example v0.2.0.
        required: true
        type: string
      macos:
        description: macOS, both architectures (.dmg and the update archives)
        type: boolean
        default: true
      linux:
        description: Linux (.AppImage, .deb, .rpm and the update archive)
        type: boolean
        default: true
      windows:
        description: Windows (-setup.exe and the update archive)
        type: boolean
        default: true
      store:
        description: Microsoft Store package (.msixupload), packaged by this branch's app/src-tauri/msix
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  # A tag naming a version the binaries do not carry would be offered forever: the updater compares
  # the running version with the one in the feed, and installing it would not change the answer.
  version:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.legs.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - name: Tag matches the workspace version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          crate=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
          test "$crate" = "${TAG#v}" || {
            echo "tag $TAG does not match Cargo.toml version $crate" >&2
            exit 1
          }

      # The build legs the ticked boxes ask for. The Windows leg also runs for the Store alone,
      # which needs its binary but not its installer.
      #
      # Linux is built on the oldest supported runner, because a Linux binary cannot run against a
      # glibc older than the one it was built on. Deprecated by GitHub on 2026-09-17 and unsupported
      # from 2027-04-17, with brownouts failing the job at random in between; it is kept anyway,
      # because moving to ubuntu-24.04 raises the floor from glibc 2.35 to 2.39 and drops Ubuntu
      # 22.04 and Debian 12 users. Move before the April date, not after a red release.
      - id: legs
        env:
          ON: ${{ toJSON(inputs) }}
        run: |
          matrix=$(jq -c --argjson on "$ON" '{include: [.[]
              | .installers = $on[.platform]
              | .store = (.platform == "windows" and $on.store)
              | select(.installers or .store)]}' <<'EOF'
          [
            {"platform": "macos", "os": "macos-latest", "target": "aarch64-apple-darwin"},
            {"platform": "macos", "os": "macos-latest", "target": "x86_64-apple-darwin"},
            {"platform": "linux", "os": "ubuntu-22.04", "target": ""},
            {"platform": "windows", "os": "windows-latest", "target": ""}
          ]
          EOF
          )
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    if: needs.version.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.version.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Linux system libraries
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libdbus-1-dev \
            libssl-dev \
            patchelf

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      # rust-toolchain.toml decides the version; the target is what this matrix entry adds.
      - name: Install the pinned toolchain
        shell: bash
        run: |
          rustup show
          if [ -n "${{ matrix.target }}" ]; then rustup target add ${{ matrix.target }}; fi

      # No rust-cache: a release target directory is gone by the next release, evicted after seven
      # days, and only crowds CI's caches out of the 10 GB until then. See ADR-0094.

      # THIRD-PARTY-NOTICES.md and the two generated files beside it are checked in, and a
      # dependency bump leaves them stale until somebody runs the generator. Generating them here
      # is what makes the copy a user gets describe the binary it came with, whoever forgot.
      - name: Generate the third-party notices
        run: node scripts/notices.mjs

      - uses: tauri-apps/tauri-action@v1
        if: matrix.installers
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update artifacts with the project's key; the public half is in
          # tauri.conf.json, so an installed copy refuses anything signed by anybody else.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          # The draft release and its notes already exist: release-please made them when its pull
          # request was merged, and this only hangs the installers on them. Naming a body here
          # would overwrite the changelog with a commit subject.
          tagName: ${{ inputs.tag }}
          releaseDraft: true
          prerelease: false
          # `latest.json`, the feed the updater reads. One per run, merged across the matrix.
          includeUpdaterJson: true
          args: ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      # The Store alone needs the binary, not the installers or the feed the release already has.
      - name: Build the binary for the Store
        if: ${{ !matrix.installers }}
        working-directory: app
        run: pnpm tauri build --no-bundle

      # The site links `releases/latest/download/<name>`, which needs a name that does not carry the
      # version. Copies, not renames: the updater feed names the versioned files.
      - name: Upload stable-named installers
        if: matrix.installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          PATHS: ${{ steps.tauri.outputs.artifactPaths }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p stable
          while IFS= read -r path; do
            path=${path%$'\r'}  # jq on the Windows runner ends lines with CRLF
            case "$path" in
              *.dmg)
                case "$TARGET" in
                  aarch64-*) name=Stonqs_macos_aarch64.dmg ;;
                  *) name=Stonqs_macos_x64.dmg ;;
                esac ;;
              *-setup.exe) name=Stonqs_windows_x64-setup.exe ;;
              *.AppImage) name=Stonqs_linux_x86_64.AppImage ;;
              *.deb) name=Stonqs_linux_amd64.deb ;;
              *.rpm) name=Stonqs_linux_x86_64.rpm ;;
              *) continue ;;
            esac
            cp "$path" "stable/$name"
          done < <(jq -r '.[]' <<<"$PATHS")
          ls stable
          gh release upload "$TAG" stable/* --clobber --repo "$GITHUB_REPOSITORY"

      # The manifest and logos come from the revision this workflow runs from, not the tag, so an
      # older tag can still be packaged for the Store.
      - name: Check out the Store packaging
        if: matrix.store
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: workflow
          sparse-checkout: app/src-tauri/msix

      # The Store's package of the same binary tauri-action just built. The Store signs it, so
      # `store.yml` sends it there and nobody installs it from the release page. A failure here
      # costs only this file (ADR-0096).
      - name: Package for the Store
        if: matrix.store
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $sdk = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\makeappx.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1).DirectoryName
          Copy-Item -Recurse workflow/app/src-tauri/msix msix
          (Get-Content workflow/app/src-tauri/msix/AppxManifest.xml -Raw).Replace('@VERSION@', "$($env:TAG.TrimStart('v')).0") |
            Set-Content msix/AppxManifest.xml -NoNewline
          # Cargo names the binary after the crate; the installers rename it to the product.
          $exe = @('target/release/Stonqs.exe', 'target/release/sq-app.exe') | Where-Object { Test-Path $_ } |
            Select-Object -First 1
          Copy-Item $exe msix/Stonqs.exe
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md msix
          & "$sdk\makepri.exe" createconfig /cf priconfig.xml /dq en-US /pv 10.0.0 /o
          & "$sdk\makepri.exe" new /pr msix /cf priconfig.xml /mn msix/AppxManifest.xml /of msix/resources.pri /o
          & "$sdk\makeappx.exe" pack /d msix /p Stonqs.msix /o
          Compress-Archive Stonqs.msix Stonqs.zip
          $upload = 'Stonqs-windows-x86_64-store.msixupload'
          Move-Item Stonqs.zip $upload
          gh release upload $env:TAG $upload --clobber --repo $env:GITHUB_REPOSITORY

  # tauri-action fills `latest.json` with the notes it was given, and it is given none on purpose:
  # naming a body above would overwrite release-please's changelog with a commit subject. So the
  # feed ships `"notes": ""` and the update dialog has nothing to show. Copy the changelog the
  # draft already carries into the field the updater reads, once every matrix leg has uploaded.
  notes:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Copy the release body into latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release download "$TAG" --pattern latest.json --dir . --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --json body --jq .body --repo "$GITHUB_REPOSITORY" > body.md
          jq --rawfile notes body.md '.notes = $notes' latest.json > patched.json
          mv patched.json latest.json
          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"
