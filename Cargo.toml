[workspace]
resolver = "3"
members = ["core", "cli", "app/src-tauri"]
# The example plugin's guest builds for wasm32-wasip2, and a workspace resolves one set of
# features for one target. It is built by `examples/plugins/mt940/build.sh`, not by `cargo build`.
exclude = ["examples/plugins/mt940/src"]

# Dependency versions live in the workspace so core and cli always build
# against the same crates.
[workspace.package]
version = "0.3.0"
edition = "2024"
# Edition 2024 needs 1.85 and `is_multiple_of` needs 1.87, but `wasmtime` needs 1.96, so that is
# the floor for everyone: one number the whole workspace is read against. The pin in
# rust-toolchain.toml is what CI and a clone actually use; this is the floor a dependency is
# resolved against.
rust-version = "1.96"
license = "AGPL-3.0-only"
homepage = "https://stonqs.app"
repository = "https://github.com/vvvlladimir/stonqs"

[workspace.dependencies]
rust_decimal = { version = "1", features = ["serde-with-str", "maths"] }
rust_decimal_macros = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
# SQLCipher rather than plain SQLite: a profile with a password keeps its database encrypted
# (ADR-0049). An unencrypted file opens exactly as before. Apple targets use CommonCrypto; the
# others need OpenSSL, bundled through `libsqlite3-sys` in core/Cargo.toml.
rusqlite = { version = "0.37", features = ["bundled-sqlcipher"] }
# Broker CSV files contain quoted fields with embedded commas, so split(',') is insufficient.
csv = "1.4"
# A broker export is not necessarily UTF-8: encoding_rs decodes the legacy code pages,
# chardetng guesses which one when there is no BOM.
encoding_rs = "0.8"
chardetng = "0.1"
ureq = "3"
# Interactive Brokers Flex Query statements are XML with the data in attributes; hand-scanning
# them would still have to decode entities, so the reader is a dependency rather than a loop.
quick-xml = { version = "0.42", default-features = false }

# Application host. It lives only in app/src-tauri; neither core nor cli sees it.
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# OS notifications for fired alerts; the frontend writes the text (ADR-0023, ADR-0034).
tauri-plugin-notification = "2"
# In-app updates over GitHub Releases, signed with the project's own key (the public half is in
# tauri.conf.json). Desktop only — a store installs the mobile builds. `process` is what restarts
# the app once an update is in place.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# The OS language, read once at startup so the UI can follow it; host-only, like tauri.
sys-locale = "0.3"
# BYOK provider keys go to the OS keychain, never to settings.json or the DB; host-only.
# The platform features are not optional: with none of them on, keyring 3 silently falls back to
# its in-memory *mock* store, where every `Entry::new` is a fresh credential — saving a key then
# appears to work and nothing is ever kept. The platform deps behind them are target-gated in
# keyring's own manifest, so naming all three costs nothing on any one platform.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
# The profile vault (ADR-0048): Argon2id turns a password into a key, XChaCha20-Poly1305 seals.
argon2 = "0.5"
# A file reader plugin is a WASM component and the host is the only place that runs one
# (ADR-0070/0073) — `core` stays a library that knows nothing about who calls it. Default features
# off: the cache, the profiler, parallel compilation and the text format are all things a reader
# of a broker file has no use for. Cranelift stays on everywhere, iOS included: there it compiles
# to Pulley bytecode, which is interpreted rather than mapped executable.
wasmtime = { version = "49", default-features = false, features = ["runtime", "std", "component-model", "cranelift", "async"] }
# WASI itself is not granted — no preopened directory and no address is reachable. It is linked
# because a guest carrying a language runtime will not instantiate without `wasi:clocks` and
# `wasi:random`, which are handed over frozen and seeded instead (ADR-0073).
wasmtime-wasi = { version = "49", default-features = false, features = ["p2"] }
# Only ever seeded, never from the OS: it is what a plugin is handed in place of real
# randomness, so two runs over one file answer the same (ADR-0073).
rand = { version = "0.10", default-features = false, features = ["std", "std_rng"] }
chacha20poly1305 = "0.10"
zeroize = "1"
base64 = "0.22"
